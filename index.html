<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        (function() {
            const savedLang = localStorage.getItem('ck-lang');
            if (savedLang === 'el') {
                window.location.href = 'https://ckont.github.io/Chrsitos-Kontousias/el/';
                return;
            }
            
            const browserLang = navigator.language || navigator.userLanguage;
            const isGreek = browserLang.startsWith('el') || browserLang.startsWith('gr');
            
            const urlParams = new URLSearchParams(window.location.search);
            const langParam = urlParams.get('lang');
            
            if (langParam === 'el' || (langParam !== 'en' && isGreek)) {
                window.location.href = 'https://ckont.github.io/Chrsitos-Kontousias/el/';
            } else {
                window.location.href = 'https://ckont.github.io/Chrsitos-Kontousias/en/';
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to your preferred language...</p>
    <p>If you are not redirected, please <a href="https://ckont.github.io/Chrsitos-Kontousias/en/">click here</a>.</p>
</body>
</html>
